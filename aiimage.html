<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stability AI Image Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 400px;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .image-container {
      margin-top: 20px;
    }
    .image-container img {
      max-width: 100%;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Stability AI Image Generator</h1>
    <input type="text" id="prompt" placeholder="Enter a prompt (e.g., 'A futuristic city')">
    <button onclick="generateImage()">Generate Image</button>
    <div class="image-container">
      <img id="generated-image" src="" alt="Generated Image" style="display: none;">
    </div>
  </div>

  <script>
    async function generateImage() {
      const prompt = document.getElementById('prompt').value;
      const apiKey = 'sk-CA4OhATn2gBN3go21Wk32IZRHQcAyZ7qGNKNN9Twgo63eReP'; // Replace with your API key
      const apiUrl = 'https://api.stability.ai/v1/generation/stable-diffusion-v1-6/text-to-image';

      // Show loading state
      const button = document.querySelector('button');
      button.disabled = true;
      button.textContent = 'Generating...';

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            text_prompts: [{ text: prompt }],
            cfg_scale: 7,
            height: 512,
            width: 512,
            steps: 30,
            samples: 1,
          }),
        });

        if (!response.ok) {
          throw new Error('Failed to generate image. Please try again.');
        }

        const data = await response.json();
        const imageUrl = data.artifacts[0].base64; // Base64-encoded image

        // Display the generated image
        const imageElement = document.getElementById('generated-image');
        imageElement.src = `data:image/png;base64,${imageUrl}`;
        imageElement.style.display = 'block';
      } catch (error) {
        alert(error.message);
      } finally {
        // Reset button state
        button.disabled = false;
        button.textContent = 'Generate Image';
      }
    }
  </script>
</body>
</html>
