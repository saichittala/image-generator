<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Upload</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Upload Video to YouTube</h2>
        
        <button id="login" class="btn">Login with Google</button>
        <button id="logout" class="btn hidden">Logout</button>
        
        <input type="file" id="videoFile" accept="video/*"><br>
        <input type="text" id="videoTitle" placeholder="Video Title"><br>
        <textarea id="videoDescription" placeholder="Video Description"></textarea><br>
        <input type="text" id="videoTags" placeholder="Tags (comma-separated)"><br>
        <input type="datetime-local" id="scheduleTime"><br>
        
        <button id="upload" class="btn upload-btn" disabled>Upload Video</button>
        
        <!-- Progress Indicator -->
        <div id="progress-container" class="hidden">
            <p>Upload Progress: <span id="progress-text">0%</span></p>
            <progress id="progress-bar" value="0" max="100"></progress>
        </div>

        <!-- Loading Spinner -->
        <div id="loading-spinner" class="hidden">
            <div class="spinner"></div>
            <p>Loading...</p>
        </div>

        <!-- Error Message -->
        <div id="error-message" class="hidden" style="color: red; margin: 10px 0;"></div>
        
        <h3>Uploaded Videos</h3>
        <ul id="videoList"></ul>
    </div>
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="js/script.js"></script>
    <script src="js/youtube.js"></script>
</body>
</html>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #f4f4f4;
    padding: 20px;
}

.container {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    width: 50%;
    margin: auto;
}

input, textarea {
    width: 90%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ddd;
    border-radius: 5px;
}

.btn {
    background-color: #ff0000;
    color: white;
    padding: 10px 20px;
    border: none;
    cursor: pointer;
    border-radius: 5px;
    transition: 0.3s;
}

.btn:hover {
    background-color: #cc0000;
}

.upload-btn {
    background-color: #4CAF50;
}

.upload-btn:hover {
    background-color: #45a049;
}

.hidden {
    display: none;
}

#progress-container {
    margin-top: 20px;
}

.spinner {
    border: 4px solid #f3f3f3;
    border-top: 4px solid #3498db;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    animation: spin 1s linear infinite;
    margin: auto;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

#loading-spinner {
    display: none;
    text-align: center;
    margin: 20px 0;
}
</style>
